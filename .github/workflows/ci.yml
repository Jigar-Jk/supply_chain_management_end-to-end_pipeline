# CI: on every push to main and every pull request -> lint, all tests, build the wheel.
# CD (dev -> qa -> approval -> prod) is a separate, manually started workflow: cd.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as your laptop)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java 17 (Spark needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (fast + Spark)
        run: python -m unittest discover -s tests -t . -v

      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Keep the wheel as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm_platform-wheel
          path: dist/*.whl
