# Daily batch: [carrier API -> landing] -> Bronze files -> Silver -> Silver quality tests -> Gold refresh.
# Runs after scm_wms_sla_check (02:30) so a missing WMS night is already carried forward.
#
# The carrier API step is switched by var.carrier_api_url:
#   carrier_api_enabled   condition task: is a URL set (not "disabled")?
#   fetch_carrier_api     only on "true": new shipments from the API into landing/shipments/
#   ingest_bronze_files   depends on the condition's "false" branch and on the fetch, with NONE_FAILED:
#                         switch off -> the "false" branch ran, the fetch was skipped -> runs;
#                         switch on  -> the fetch ran: succeeded -> runs, failed -> does not,
#                         so a broken API run never lets Bronze go ahead with half the shipments
# While the URL is "disabled", shipments come from the file scripts/up.ps1 uploads, as before.
resources:
  jobs:
    scm_daily_pipeline:
      name: "[${bundle.target}] scm_daily_pipeline"
      description: "Daily medallion run; any failing step stops the chain before Gold."
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: batch_compute
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            # Unity Catalog access mode: reads abfss:// through the external locations (no storage keys)
            data_security_mode: SINGLE_USER
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            spark_env_vars:
              CARRIER_API_KEY: "{{secrets/scm-platform/carrier-api-key}}"
            custom_tags:
              "ResourceClass": "SingleNode"
              "Project": "scm-logistics-platform"

      tasks:
        - task_key: carrier_api_enabled
          condition_task:
            op: NOT_EQUAL
            left: "${var.carrier_api_url}"
            right: "disabled"

        - task_key: fetch_carrier_api
          depends_on:
            - task_key: carrier_api_enabled
              outcome: "true"
          job_cluster_key: batch_compute
          max_retries: 1                       # the client already retries each request with backoff
          min_retry_interval_millis: 300000
          python_wheel_task:
            package_name: scm_platform
            entry_point: scm-ingest-api
            parameters: ["--source", "carrier", "--base-url", "${var.carrier_api_url}", "--catalog", "${var.catalog}",
                         "--landing", "abfss://landing@${var.storage_account}.dfs.core.windows.net/shipments",
                         "--run-id", "{{job.run_id}}"]
          libraries:
            - whl: ../../dist/*.whl

        - task_key: ingest_bronze_files
          depends_on:
            - task_key: carrier_api_enabled
              outcome: "false"                 # Databricks requires an outcome on every condition dependency
            - task_key: fetch_carrier_api
          run_if: NONE_FAILED
          job_cluster_key: batch_compute
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: scm_platform
            entry_point: scm-ingest-bronze
            parameters: ["--storage-account", "${var.storage_account}", "--catalog", "${var.catalog}",
                         "--feed", "all", "--batch-id", "{{job.run_id}}"]
          libraries:
            - whl: ../../dist/*.whl

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze_files
          job_cluster_key: batch_compute
          python_wheel_task:
            package_name: scm_platform
            entry_point: scm-transform-silver
            parameters: ["--catalog", "${var.catalog}", "--batch-id", "{{job.run_id}}"]
          libraries:
            - whl: ../../dist/*.whl

        - task_key: silver_quality_tests
          depends_on:
            - task_key: transform_silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/silver_quality_tests.sql      # written in step 4
            parameters:
              catalog: ${var.catalog}

        - task_key: refresh_gold
          depends_on:
            - task_key: silver_quality_tests
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/refresh_gold.sql
            parameters:
              catalog: ${var.catalog}

        # Early warning (>= 5 % quarantined today): evaluates the SQL alert from infra/alerts.tf and
        # e-mails the subscribers. ALL_DONE: it also runs when a later step (the 20 % hard stop) failed.
        - task_key: quarantine_rate_alert
          depends_on:
            - task_key: transform_silver
          run_if: ALL_DONE
          sql_task:
            warehouse_id: ${var.warehouse_id}
            alert:
              alert_id: ${var.quarantine_alert_id}
              subscriptions:
                - user_name: ${var.alert_email}

      tags:
        project: "scm-logistics-platform"
        managed_by: "databricks-asset-bundles"
