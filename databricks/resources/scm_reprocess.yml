# Quarantine reprocessing every 2 hours: replays PENDING rows (steward corrections first) through the
# same quality gate; healed rows are merged into Silver, rows past the 7-day SLA are REJECTED.
resources:
  jobs:
    scm_reprocess:
      name: "[${bundle.target}] scm_reprocess"
      description: "Replays PENDING quarantine rows; marks them REPROCESSED or REJECTED."
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 */2 * * ?"
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: reprocess_compute
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            custom_tags:
              "ResourceClass": "SingleNode"
              "Project": "scm-logistics-platform"

      tasks:
        - task_key: reprocess_quarantine
          job_cluster_key: reprocess_compute
          max_retries: 1
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: scm_platform
            entry_point: scm-reprocess-quarantine
            parameters: ["--catalog", "${var.catalog}"]
          libraries:
            - whl: ../../dist/*.whl

      tags:
        project: "scm-logistics-platform"
        managed_by: "databricks-asset-bundles"
