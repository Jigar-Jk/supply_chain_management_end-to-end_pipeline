# WMS nightly snapshot SLA: files must land by 02:00 UTC. Runs at 02:30, before scm_daily_pipeline (03:00).
# On a miss it carries forward last night's stock as is_stale rows, logs SLA_MISS to ops.pipeline_run_log
# and then FAILS on purpose - the failure is what sends the alert e-mail. No retries for that reason.
resources:
  jobs:
    scm_wms_sla_check:
      name: "[${bundle.target}] scm_wms_sla_check"
      description: "Checks the WMS nightly inventory files arrived on time; carries forward last-known-good stock if not."
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: sla_compute
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            # Unity Catalog access mode: reads abfss:// through the external locations (no storage keys)
            data_security_mode: SINGLE_USER
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            custom_tags:
              "ResourceClass": "SingleNode"
              "Project": "scm-logistics-platform"

      tasks:
        - task_key: check_wms_snapshot
          job_cluster_key: sla_compute
          max_retries: 0
          python_wheel_task:
            package_name: scm_platform
            entry_point: scm-wms-sla-check
            parameters: ["--catalog", "${var.catalog}", "--run-id", "{{job.run_id}}"]
          libraries:
            - whl: ../../dist/*.whl

      tags:
        project: "scm-logistics-platform"
        managed_by: "databricks-asset-bundles"
